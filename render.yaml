# Render Blueprint — deploys Tempest Isles as a FREE static site. The game is
# entirely client-side (no server), so there is nothing to sleep or cold-start.
#
# One-time setup: render.com → New → Blueprint → pick this repo → Apply.
# Every push to main then rebuilds and redeploys automatically.
services:
  - type: web
    name: tempest-isles
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      # Vite fingerprints everything under /assets, so it can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # "/" is matched separately from "/index.html".
      - path: /
        name: Cache-Control
        value: no-cache
      # Security headers. The game loads nothing from other sites, so the CSP
      # can be strict (inline styles are used for player colors).
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: X-Frame-Options
        value: DENY
