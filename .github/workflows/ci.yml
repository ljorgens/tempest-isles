name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token, even for pull requests from forks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A change that makes games never end should fail fast, not run for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Typecheck (game + simulator)
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Validate map
        run: npm run validate
      - name: Simulate 200 all-AI games per rank
        run: npm run sim -- 200
